name: Blog CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check
      - run: node scripts/check-output.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Stamp production artifact
        run: node -e "require('node:fs').writeFileSync('dist/version.json', JSON.stringify({commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
