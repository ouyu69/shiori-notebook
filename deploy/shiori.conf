server {
    listen 80 default_server;
    server_name 117.72.196.0;
    root /srv/shiori-notebook/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location /_astro/ {
        alias /srv/shiori-notebook/shared/_astro/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /pagefind/ {
        try_files $uri @previous_search_asset;
        add_header Cache-Control "no-cache";
    }
    location @previous_search_asset {
        root /srv/shiori-notebook/shared;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ \.html$ { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-store"; }
    location = /manifest.json { deny all; }
    location ~ /\. { deny all; }
}
